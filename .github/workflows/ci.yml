name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The tests use tiny models, so the CPU build of PyTorch is enough (and much smaller).
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=2.0" "matplotlib>=3.9" "pytest>=8.0"

      - name: Tests
        run: pytest -q
